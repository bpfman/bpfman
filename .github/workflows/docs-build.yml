name: bpfman-docs

on: # yamllint disable-line rule:truthy
  push:
    branches: [main]
    tags:
      - v*

jobs:
  build-docs:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -qy \
            libxml2-dev \
            libxslt-dev \

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # @v4
        with:
          ref: gh-pages
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # @v4
      - uses: astral-sh/setup-uv@v7
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # @v5
        with:
          go-version-file: go.mod

      - name: Build API docs
        run: |
          ./scripts/api-docs/generate.sh apidocs.html

      - name: Configure Git user
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"

      - name: Deploy Docs (Release Version)
        if: startsWith(github.ref_name, 'v')
        run: |
          uv run mike deploy --push --update-aliases --alias-type=redirect ${{ github.ref_name }} latest

      - name: Deploy Docs (Development Version)
        if: github.ref_name == 'main'
        run: |
          uv run mike deploy --push main
